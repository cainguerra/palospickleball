<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="#4a7c59"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#8b7355" stroke-width="6"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#faf8f5" stroke-width="2" stroke-dasharray="4 6" opacity="0.5"/>

  <!-- Paddle (behind ball, angled) -->
  <g transform="rotate(-35 100 100)">
    <rect x="92" y="18" width="16" height="80" rx="8" fill="#8b7355"/>
    <rect x="92" y="18" width="16" height="80" rx="8" fill="none" stroke="#5d4e37" stroke-width="2"/>
    <!-- Paddle face -->
    <ellipse cx="100" cy="120" rx="34" ry="42" fill="#faf8f5" stroke="#5d4e37" stroke-width="3"/>
    <!-- Grip texture -->
    <line x1="95" y1="30" x2="105" y2="30" stroke="#5d4e37" stroke-width="2"/>
    <line x1="95" y1="40" x2="105" y2="40" stroke="#5d4e37" stroke-width="2"/>
    <line x1="95" y1="50" x2="105" y2="50" stroke="#5d4e37" stroke-width="2"/>
    <!-- Face holes -->
    <circle cx="88" cy="110" r="4" fill="#4a7c59"/>
    <circle cx="112" cy="110" r="4" fill="#4a7c59"/>
    <circle cx="100" cy="128" r="4" fill="#4a7c59"/>
    <circle cx="88" cy="132" r="3" fill="#4a7c59"/>
    <circle cx="112" cy="132" r="3" fill="#4a7c59"/>
    <circle cx="100" cy="108" r="3" fill="#4a7c59"/>
  </g>

  <!-- Pickleball (front) -->
  <circle cx="128" cy="82" r="30" fill="#faf8f5" stroke="#5d4e37" stroke-width="3"/>
  <!-- Ball seam lines -->
  <path d="M 98 82 Q 128 62 158 82" fill="none" stroke="#8b7355" stroke-width="2.5"/>
  <path d="M 98 82 Q 128 102 158 82" fill="none" stroke="#8b7355" stroke-width="2.5"/>
  <path d="M 128 52 L 128 112" fill="none" stroke="#8b7355" stroke-width="2.5"/>
  <!-- Ball holes -->
  <circle cx="112" cy="74" r="2.5" fill="#5d4e37"/>
  <circle cx="128" cy="68" r="2.5" fill="#5d4e37"/>
  <circle cx="144" cy="74" r="2.5" fill="#5d4e37"/>
  <circle cx="120" cy="92" r="2.5" fill="#5d4e37"/>
  <circle cx="136" cy="92" r="2.5" fill="#5d4e37"/>
</svg>
